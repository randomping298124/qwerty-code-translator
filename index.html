<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QWERTY Cipher</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5; 
            color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff; 
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #000000; /* Changed to black */
            margin-top: 0;
        }
        
        /* --- UPDATED TEXTAREA STYLES FOR READABILITY --- */
        textarea {
            width: 100%;
            height: 120px;
            background-color: #ffffff; 
            color: #000000; /* Pure black text */
            border: 2px solid #b3b3b3; /* Thicker border so it stands out */
            border-radius: 8px;
            padding: 15px; /* More breathing room */
            font-size: 18px; /* Larger font size */
            resize: none;
            box-sizing: border-box;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); /* Inner shadow for depth */
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #4CAF50; /* Green border when clicked */
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.4), inset 0 2px 5px rgba(0,0,0,0.05);
        }
        textarea::placeholder {
            color: #666666; /* Darker placeholder text */
        }
        /* ----------------------------------------------- */

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-encode { background-color: #4CAF50; color: white; }
        .btn-encode:hover { background-color: #45a049; }
        .btn-decode { background-color: #2196F3; color: white; }
        .btn-decode:hover { background-color: #1e88e5; }
        
        .result-box {
            margin-top: 20px;
            background-color: #fafafa; 
            color: #333333;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eeeeee;
            border-left: 4px solid #4CAF50;
            word-wrap: break-word;
            display: none; 
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .btn-copy {
            background-color: #e0e0e0; 
            color: #333333;
            padding: 6px 12px;
            font-size: 14px;
            flex: none; 
        }
        .btn-copy:hover {
            background-color: #cccccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QWERTY Cipher</h1>
    
    <textarea id="userInput" placeholder="Enter your text here..."></textarea>
    
    <div class="buttons">
        <button onclick="handleAction('decode')" class="btn-decode">Decode</button>
        <button onclick="handleAction('encode')" class="btn-encode">Encode</button>
    </div>

    <div id="resultBox" class="result-box">
        <div class="result-header">
            <strong>Result:</strong>
            <button onclick="copyToClipboard()" class="btn-copy" id="copyBtn">Copy</button>
        </div>
        <p id="resultText" style="font-family: monospace; margin: 0; font-size: 16px;"></p>
    </div>
</div>

<script>
    function isAlpha(char) {
        return /^[a-z]$/i.test(char);
    }

    function encodeQwerty(plaintext) {
        const qwertyLayout = "qwertyuiopasdfghjklzxcvbnm";
        let encodedText = "";
        
        for (let char of plaintext.toLowerCase()) {
            if (char === " ") {
                encodedText += qwertyLayout;
            } else if (qwertyLayout.includes(char)) {
                encodedText += qwertyLayout.replace(char, "");
            } else {
                encodedText += char;
            }
        }
        return encodedText;
    }

    function decodeQwerty(encodedText) {
        const qwertyLayout = "qwertyuiopasdfghjklzxcvbnm";
        let decodedText = "";
        let i = 0;
        
        while (i < encodedText.length) {
            if (!isAlpha(encodedText[i])) {
                decodedText += encodedText[i];
                i++;
                continue;
            }
            
            let j = 0;
            let missingChar = " ";
            
            while (j < 26) {
                if (i < encodedText.length && isAlpha(encodedText[i]) && encodedText[i].toLowerCase() === qwertyLayout[j]) {
                    i++;
                } else {
                    missingChar = qwertyLayout[j];
                }
                j++;
            }
            decodedText += missingChar;
        }
        return decodedText;
    }

    function handleAction(action) {
        const input = document.getElementById('userInput').value;
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const copyBtn = document.getElementById('copyBtn');
        
        if (!input) return;

        if (action === 'encode') {
            resultText.textContent = encodeQwerty(input);
        } else {
            resultText.textContent = decodeQwerty(input);
        }
        
        resultBox.style.display = 'block';
        copyBtn.textContent = 'Copy';
    }

    function copyToClipboard() {
        const resultText = document.getElementById('resultText').textContent;
        const copyBtn = document.getElementById('copyBtn');
        
        navigator.clipboard.writeText(resultText).then(() => {
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.textContent = 'Copy';
            }, 2000);
        });
    }
</script>

</body>
</html>
